<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card with rounded corners -->
  <rect width="850" height="200" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Decorative glow circles -->
  <circle cx="730" cy="60" r="90" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>
  <circle cx="120" cy="150" r="70" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Subtle Geometric Grid Lines -->
  <path d="M0 50 H850 M0 100 H850 M0 150 H850" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="4 8"/>
  <path d="M150 0 V200 M350 0 V200 M550 0 V200 M750 0 V200" stroke="#334155" stroke-opacity="0.25" stroke-dasharray="4 8"/>

  <!-- Terminal Badge on top -->
  <rect x="40" y="30" width="135" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <circle cx="56" cy="43" r="4" fill="#ef4444"/>
  <circle cx="70" cy="43" r="4" fill="#eab308"/>
  <circle cx="84" cy="43" r="4" fill="#22c55e"/>
  <text x="100" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">ENGINEER</text>

  <!-- Main Headline -->
  <text x="40" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Culture Simple Official
  </text>

  <!-- Subtitle with Gradient -->
  <text x="40" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="url(#accentGrad)">
    Full-Stack &amp; Biometric Enterprise Software Engineer
  </text>

  <!-- Tech tags line -->
  <text x="40" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
    Laravel 12  •  PHP 8.4  •  PostgreSQL &amp; Supabase  •  MediaPipe AI Vision  •  Cloudflare  •  PWA
  </text>

  <!-- Right Geometric Tech Symbol -->
  <g transform="translate(685, 45)">
    <rect width="110" height="110" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <polygon points="55,20 85,38 85,72 55,90 25,72 25,38" stroke="url(#accentGrad)" stroke-width="2.5" fill="none"/>
    <circle cx="55" cy="55" r="14" fill="url(#accentGrad)" opacity="0.2"/>
    <circle cx="55" cy="55" r="6" fill="#38bdf8"/>
  </g>
</svg>
