    <path d="M48 24 L72 38 V66 L48 80 L24 66 V38 Z" stroke="url(#accent)" stroke-width="2" fill="none"/>
    <path d="M48 38 L60 45 V59 L48 66 L36 59 V45 Z" fill="url(#accent)" opacity="0.2"/>
